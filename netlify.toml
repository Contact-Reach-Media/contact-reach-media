# Netlify Configuration for ContactReach Market
[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to Cloud Run backend with full Cloud SQL database access
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-5yei3t5fbpm5y4v7w2ck65-894432086585.europe-west2.run.app/api/:splat"
  status = 200

# Single-page application fallback: reroute all paths to index.html with HTTP 200 (prevents 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets with high longevity
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
